local_sub2api:
  base_url: "https://api.zhouz.online"
  admin_token_env: "SUB2API_ADMIN_TOKEN"

policy:
  safety_margin: 0.02
  self_built_rate: 0
  sales_groups:
    - name: "0.12"
      group_id: 101
      rate: 0.12
    - name: "0.18"
      group_id: 102
      rate: 0.18
    - name: "0.25"
      group_id: 103
      rate: 0.25
  priority:
    self_built: 1
    upstream_start: 5
    upstream_step: 5

upstreams:
  - id: "mdkj"
    base_url: "https://api.mdkj.lol"
    pricing_page_url: "https://api.mdkj.lol/"
    browser_profile: "mdkj"
    group_name_aliases:
      pro: ["pro", "Pro", "PRO", "专业版"]
      plus: ["plus", "Plus"]

accounts:
  - match_name: "https://api.mdkj.lol-pro-*"
    upstream_id: "mdkj"
    upstream_group: "pro"
    allowed_sales_groups: ["0.12", "0.18"]
  - match_name: "https://api.mdkj.lol-plus-*"
    upstream_id: "mdkj"
    upstream_group: "plus"
    allowed_sales_groups: ["0.18", "0.25"]

self_built_accounts:
  - match_name: "self-*"
    allowed_sales_groups: ["0.12", "0.18", "0.25"]
